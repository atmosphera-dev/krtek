[package]
name = "talpid-lan-forwarder"
edition.workspace = true
rust-version.workspace = true
description = "Bounded local TCP and UDP delivery through an injected socket authority"
repository.workspace = true
license.workspace = true

[features]
# Private test APKs only: records endpoint/socket metadata; never enable by default.
r06-diagnostics = ["dep:libc"]

[dependencies]
log = { workspace = true }
socket2 = { workspace = true }
talpid-types = { path = "../talpid-types" }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
smoltcp = { version = "0.13", default-features = false, features = [
  "medium-ip",
  "proto-ipv4",
  "proto-ipv6",
  "socket-tcp",
  "std",
] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = { version = "0.2", optional = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
talpid-netstack = { path = "../talpid-netstack" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
